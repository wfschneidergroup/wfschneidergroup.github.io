<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
    <meta charset="UTF-8">
    {% include css.html %}

    <style>
      /* FORCE ASPECT RATIO & PREVENT DISTORTION */
      #carouselExampleIndicators {
        max-width: 100%;
        margin: 0 auto;
        background-color: #000;
        border-radius: 8px;
        overflow: hidden;
      }

      #carouselExampleIndicators .carousel-inner {
        height: 600px !important;
      }

      #carouselExampleIndicators .carousel-item {
        height: 600px !important;
        background-color: #000;
      }

      #carouselExampleIndicators .carousel_img {
        width: 100% !important;
        height: 600px !important;
        /* object-fit: cover crops the image to fill the box without stretching */
        object-fit: cover !important; 
        object-position: center 20% !important;
        display: block;
      }

      /* CAPTION STYLING */
      .carousel-caption-group {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 43, 91, 0.85); /* Notre Dame Blue */
        padding: 15px !important;
        z-index: 10;
        text-align: center;
      }

      .group-caption {
        color: white !important;
        font-weight: 600 !important;
        font-size: 1.1rem !important;
        margin: 0 !important;
      }

      /* RESPONSIVE FIX FOR MOBILE */
      @media (max-width: 768px) {
        #carouselExampleIndicators .carousel-inner, 
        #carouselExampleIndicators .carousel-item,
        #carouselExampleIndicators .carousel_img {
          height: 350px !important;
        }
      }
    </style>
</head>
<body>

    {% include header.html %}
    {% include navigation.html %}

    <section class="main-content">
      <div class="row justify-content-center align-content-center">
        <div class="col-auto col-md-12" align="center">
          <div class="gallery">

            <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel" align="center" data-interval="10000">
              
              <ol class="carousel-indicators">
                {% for entry in site.data.group_photo %}
                  <li data-target="#carouselExampleIndicators" data-slide-to="{{ entry.index }}" {% if forloop.first %}class="active"{% endif %}></li>
                {% endfor %}
              </ol>

              <div class="carousel-inner" role="listbox">
                {% for entry in site.data.group_photo %}
                  <div class="carousel-item {% if forloop.first %}active{% endif %}">
                    <img class="carousel_img" src="{{ entry.url | relative_url }}">
                    <div class="carousel-caption-group">
                      <p class="group-caption">{{ entry.caption }}</p>
                    </div>
                  </div>
                {% endfor %}
              </div>

              <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">Previous</span>
              </a>
              <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">Next</span>
              </a>
            </div>

          </div>
        </div>
      </div>

      {% include footer.html %}
    </section>

    {% include js.html %}
</body>
</html>
